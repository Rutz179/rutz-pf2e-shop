# Builds and publishes a Foundry release whenever a version tag is pushed.
#
#   git tag v1.1.2
#   git push origin v1.1.2
#
# The version is taken from the tag, so module.json does not need to be
# edited by hand. The release gets two files:
#   module.json  – the manifest Foundry checks for updates
#   module.zip   – the package Foundry downloads
#
# Lite / Plus: edition.json's "public" says which edition this public release
# carries ("plus" during the open beta, "lite" after). The Plus edition for
# supporters is built on your PC with `node tools/edition.mjs plus` and
# uploaded to the hub.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version from tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp module.json
        env:
          VERSION: ${{ steps.version.outputs.number }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          jq --arg v "$VERSION" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             --arg url "https://github.com/$REPO" \
             '.version = $v | .manifest = $manifest | .download = $download | .url = $url' \
             module.json > module.tmp.json
          mv module.tmp.json module.json
          echo "Releasing version $VERSION"

      # Lite or Plus, as edition.json says (Lite leaves the Plus files out).
      - name: Make the public edition
        run: node tools/edition.mjs public --in-place

      - name: Build module.zip
        run: |
          zip -r module.zip . \
            -x ".git/*" ".github/*" "dist/*" "tools/*" "edition.json" \
               "*node_modules*" "*package-lock.json" \
               "*.env" \
               ".gitignore" ".DS_Store" "*/.DS_Store"
          unzip -l module.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
